// ── AEDT TIME HELPERS ─────────────────────────────────────────────────────
// Always display in Australia/Sydney timezone (AEST/AEDT auto)
function toAEDT(dateInput) {
  if (!dateInput) return null;
  try {
    const d = (dateInput instanceof Date) ? dateInput : new Date(dateInput);
    if (isNaN(d)) return null;
    return d;
  } catch { return null; }
}

function formatAEDT(dateInput) {
  const d = toAEDT(dateInput);
  if (!d) return "—";
  try {
    return d.toLocaleString("en-AU", {
      timeZone: "Australia/Sydney",
      day:   "2-digit",
      month: "2-digit",
      year:  "2-digit",
      hour:  "numeric",
      minute:"2-digit",
      hour12: true,
    }).replace(",", "");
  } catch { return "—"; }
}

function formatAEDTTimeOnly(dateInput) {
  const d = toAEDT(dateInput);
  if (!d) return "";
  try {
    return d.toLocaleString("en-AU", {
      timeZone: "Australia/Sydney",
      hour:  "numeric",
      minute:"2-digit",
      hour12: true,
    });
  } catch { return ""; }
}

function formatDateOnly(dateStr) {
  // For historical events that only have a date string YYYY-MM-DD
  if (!dateStr) return "—";
  const parts = dateStr.split("-");
  if (parts.length === 3) return `${parts[2]}/${parts[1]}/${parts[2].length===4?parts[0].slice(2):parts[0]}`;
  return dateStr;
}

// ── RSS PARSER (preserves raw pubDate for AEDT display) ───────────────────
function parseRSS(xml, feed) {
  try {
    const doc = new DOMParser().parseFromString(xml, "text/xml");
    let pat = RELEVANCE;
    if (feed.region === "government") pat = GOVT_REL;
    if (feed.region === "tactical")   pat = TACTICAL_REL;

    return Array.from(doc.querySelectorAll("item")).slice(0, 12).reduce((acc, item) => {
      const title   = item.querySelector("title")?.textContent?.trim() || "";
      const desc    = (item.querySelector("description")?.textContent || "")
        .replace(/<[^>]*>/g, "").replace(/\s+/g, " ").trim().slice(0, 320);
      const pubRaw  = item.querySelector("pubDate")?.textContent || "";
      const link    = item.querySelector("link")?.textContent?.trim() || "#";

      // Parse pubDate to a Date object for AEDT formatting
      let pubDate = null;
      if (pubRaw) {
        const parsed = new Date(pubRaw);
        if (!isNaN(parsed)) pubDate = parsed;
      }
      if (!pubDate) pubDate = new Date();

      const dateStr = pubDate.toISOString().split("T")[0]; // YYYY-MM-DD for sorting

      if (!pat.test(title + " " + desc)) return acc;

      acc.push({
        id:       `rss_${feed.id}_${Date.now()}_${acc.length}`,
        date:     dateStr,
        pubDate:  pubDate,           // raw Date for AEDT display
        title:    title.slice(0, 130),
        summary:  desc,
        region:   feed.region,
        type:     feed.type,
        source:   feed.label,
        link,
        live:     true,
      });
      return acc;
    }, []);
  } catch { return []; }
}

// ── COMPONENTS ────────────────────────────────────────────────────────────
function LiveDot({ color, size=7 }) {
  return <span style={{ display:"inline-block", width:size, height:size, borderRadius:"50%",
    background:color||"#ff6600", animation:"pls 1.3s infinite", flexShrink:0 }} />;
}

function TimeStamp({ event, T }) {
  // Live events: show full AEDT datetime. Historical: show date only.
  if (event.pubDate) {
    const aedt = formatAEDT(event.pubDate);
    const timeOnly = formatAEDTTimeOnly(event.pubDate);
    return (
      <div style={{ textAlign:"right" }}>
        <div style={{ fontSize:"9px", color:T.text3, lineHeight:1.5, whiteSpace:"nowrap" }}>
          {event.date.split("-").reverse().slice(0,2).join("/")+"/"+event.date.split("-")[0].slice(2)}
        </div>
        <div style={{ fontSize:"10px", color:T.timeCol, fontWeight:600, letterSpacing:"0.3px", whiteSpace:"nowrap" }}>
          {timeOnly} AEDT
        </div>
        {event.live && (
          <div style={{ display:"flex", alignItems:"center", justifyContent:"flex-end", gap:3, marginTop:2 }}>
            <LiveDot color={T.liveCol} size={5} />
            <span style={{ fontSize:"8px", color:T.liveCol, letterSpacing:"1px" }}>LIVE</span>
          </div>
        )}
      </div>
    );
  }
  // Historical event
  return (
    <div style={{ textAlign:"right" }}>
      <div style={{ fontSize:"10px", color:T.text3, lineHeight:1.5 }}>
        {event.date.split("-").reverse().join("/")}
      </div>
    </div>
  );
}

function RegionIcon({ region }) {
  const icons = { global:"🌐", australia:"🇦🇺", nsw:"📍", government:"🏛️", tactical:"⚔️" };
  return icons[region] || "●";
}

function EventCard({ event, T }) {
  const [open, setOpen] = useState(false);
  const isCrit = event.critical;
  const isLive = event.live;
  const isGovt = event.region === "government";
  const accentColor = isGovt ? T.govtCol : isCrit ? T.accent : isLive ? T.liveCol : "transparent";

  return (
    <div onClick={() => setOpen(o => !o)} style={{
      display:"flex", gap:"12px", padding:"9px 14px 9px 10px", marginBottom:"1px",
      background: open ? T.cardHov : isCrit ? `${T.accent}11` : isGovt ? `${T.govtCol}08` : T.card,
      borderLeft:`3px solid ${accentColor}`,
      cursor:"pointer", transition:"background 0.15s",
    }}>
      {/* Timestamp column */}
      <div style={{ flexShrink:0, width:90, paddingTop:2 }}>
        <TimeStamp event={event} T={T} />
      </div>
      {/* Node */}
      <div style={{ display:"flex", flexDirection:"column", alignItems:"center", flexShrink:0, width:16 }}>
        <div style={{ width:9, height:9, borderRadius:"50%", marginTop:3, flexShrink:0,
          background: isCrit?T.accent : isGovt?T.govtCol : isLive?T.liveCol : T.border2,
          border:`2px solid ${isCrit?T.accent:isGovt?T.govtCol:isLive?T.liveCol:T.border2}`,
          boxShadow: isCrit?`0 0 8px ${T.accent}66` : isGovt?`0 0 6px ${T.govtCol}44` : "none" }} />
        <div style={{ flex:1, width:1, background:T.border, marginTop:4, minHeight:14 }} />
      </div>
      {/* Content */}
      <div style={{ flex:1, minWidth:0 }}>
        <div style={{ display:"flex", gap:6, flexWrap:"wrap", alignItems:"flex-start" }}>
          <span style={{ fontSize:"12px", fontWeight:600,
            color: isCrit?T.accent : isGovt?T.govtCol : isLive?T.accent2 : T.text,
            flex:1, minWidth:"140px", lineHeight:1.4 }}>{event.title}</span>
          <div style={{ display:"flex", gap:4, flexShrink:0 }}>
            <span style={{ fontSize:"9px", padding:"2px 7px", borderRadius:"2px",
              background:T.tagBg, color:T.tagText, letterSpacing:"0.5px" }}>{event.type}</span>
            <span style={{ fontSize:"9px", padding:"2px 7px", borderRadius:"2px",
              background:T.tagBg, color:T.tagText }}><RegionIcon region={event.region} /></span>
          </div>
        </div>
        {open && <div style={{ fontSize:"11px", color:T.text2, marginTop:5, lineHeight:1.6 }}>{event.summary}</div>}
        <div style={{ display:"flex", gap:10, marginTop:4, alignItems:"center", flexWrap:"wrap" }}>
          <span style={{ fontSize:"9px", color:T.text3 }}>◈ {event.source}</span>
          {event.link && event.link !== "#" && (
            <a href={event.link} target="_blank" rel="noopener noreferrer"
              onClick={e => e.stopPropagation()}
              style={{ fontSize:"9px", color:T.accent, textDecoration:"none" }}>→ source ↗</a>
          )}
        </div>
      </div>
    </div>
  );
}

function StreamItem({ event, T }) {
  const isGovt = event.region === "government";
  return (
    <div style={{ padding:"8px 10px", borderBottom:`1px solid ${T.streamBorder}`,
      background: event.critical ? `${T.accent}0a` : isGovt ? `${T.govtCol}08` : "transparent" }}>
      <div style={{ display:"flex", alignItems:"flex-start", gap:6 }}>
        {event.live && <LiveDot color={isGovt ? T.govtCol : T.liveCol} size={6} />}
        <div style={{ flex:1, minWidth:0 }}>
          <div style={{ fontSize:"11px", fontWeight:600,
            color: event.critical?T.accent : isGovt?T.govtCol : T.text,
            lineHeight:1.4, marginBottom:3 }}>{event.title}</div>
          <div style={{ display:"flex", gap:6, alignItems:"center", flexWrap:"wrap" }}>
            {/* AEDT time for live items, date only for historical */}
            {event.pubDate ? (
              <span style={{ fontSize:"9px", color:T.timeCol, fontWeight:600, whiteSpace:"nowrap" }}>
                {formatAEDTTimeOnly(event.pubDate)} AEDT
              </span>
            ) : (
              <span style={{ fontSize:"9px", color:T.text3 }}>
                {event.date.split("-").reverse().join("/")}
              </span>
            )}
            <span style={{ fontSize:"9px", color:T.text3 }}>◈ {event.source}</span>
            {event.link && event.link !== "#" && (
              <a href={event.link} target="_blank" rel="noopener noreferrer"
                style={{ fontSize:"9px", color:T.accent, textDecoration:"none" }}>↗</a>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

// ── MAIN APP ──────────────────────────────────────────────────────────────
function App() {
  const [dark, setDark]             = useState(true);
  const [tab,  setTab]              = useState("all");
  const [liveEvents, setLiveEvents] = useState([]);
  const [feedStatus, setFeedStatus] = useState({});
  const [loading, setLoading]       = useState(false);
  const [lastRefresh, setLastRefresh] = useState(null);
  const [countdown, setCountdown]   = useState(180);
  const [typeFilter, setTypeFilter] = useState("all");
  const [search, setSearch]         = useState("");
  const [showSettings, setShowSettings] = useState(false);
  const timerRef = useRef(null);
  const cdRef    = useRef(null);
  const T = dark ? DARK : LIGHT;

  const fetchAll = useCallback(async () => {
    setLoading(true);
    const statuses = {}, items = [];
    // Decide which feeds to fetch based on active tab
    const feedsToFetch =
      tab === "tactical"   ? TACTICAL_FEEDS :
      tab === "government" ? GOVT_FEEDS :
      ALL_FEEDS;

    await Promise.allSettled(feedsToFetch.map(async feed => {
      try {
        const r = await fetch(PROXY + encodeURIComponent(feed.url));
        if (!r.ok) throw new Error("HTTP " + r.status);
        const j = await r.json();
        const parsed = parseRSS(j.contents, feed);
        items.push(...parsed);
        statuses[feed.id] = { ok:true, count:parsed.length };
      } catch(e) {
        statuses[feed.id] = { ok:false };
      }
    }));

    setFeedStatus(p => ({ ...p, ...statuses }));
    if (items.length) {
      setLiveEvents(prev => {
        const seen = new Set(prev.map(e => e.title));
        return [...items.filter(e => !seen.has(e.title)), ...prev].slice(0, 400);
      });
    }
    setLastRefresh(new Date());
    setLoading(false);
    setCountdown(180);
  }, [tab]);

  useEffect(() => {
    fetchAll();
    timerRef.current = setInterval(fetchAll, REFRESH_MS);
    cdRef.current    = setInterval(() => setCountdown(c => Math.max(0, c - 1)), 1000);
    return () => { clearInterval(timerRef.current); clearInterval(cdRef.current); };
  }, [fetchAll]);

  const allEvents = [...liveEvents, ...HISTORY]
    .sort((a, b) => {
      // Sort by pubDate if available, otherwise by date string
      const da = a.pubDate ? a.pubDate : new Date(a.date);
      const db = b.pubDate ? b.pubDate : new Date(b.date);
      return db - da;
    });

  const allTypes = [...new Set(allEvents.map(e => e.type))].sort();

  function filtered(region) {
    return allEvents.filter(e => {
      if (region && e.region !== region) return false;
      if (typeFilter !== "all" && e.type !== typeFilter) return false;
      if (search && !`${e.title} ${e.summary} ${e.source}`.toLowerCase().includes(search.toLowerCase())) return false;
      return true;
    });
  }

  const okFeeds    = Object.values(feedStatus).filter(s => s.ok).length;
  const totalFeeds = ALL_FEEDS.length;

  const nowAEDT = new Date().toLocaleString("en-AU", {
    timeZone:"Australia/Sydney", hour:"numeric", minute:"2-digit", hour12:true,
    day:"2-digit", month:"2-digit"
  });

  function TabBtn({ id, label }) {
    const active = tab === id;
    const isGovt = id === "government";
    return (
      <button onClick={() => setTab(id)} style={{
        padding:"6px 14px", borderRadius:"2px", fontSize:"11px", letterSpacing:"1px",
        border: active ? `1px solid ${isGovt ? T.govtCol : T.accent}` : `1px solid ${T.border2}`,
        background: active ? `${isGovt ? T.govtCol : T.accent}18` : T.card,
        color: active ? (isGovt ? T.govtCol : T.accent) : T.text3,
        cursor:"pointer", fontFamily:"inherit", transition:"all 0.12s",
      }}>{label}</button>
    );
  }

  // Which feeds to show in the status bar
  const statusFeeds =
    tab === "tactical"   ? TACTICAL_FEEDS :
    tab === "government" ? GOVT_FEEDS :
    RSS_FEEDS;

  return (
    <div style={{ background:T.bg, color:T.text, minHeight:"100vh", fontFamily:"'IBM Plex Mono','Courier New',monospace" }}>
      <style>{`
        @keyframes pls { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(1.5)} }
        @keyframes glitch { 0%,92%,100%{text-shadow:none} 93%{text-shadow:2px 0 #cc3333,-2px 0 #4488ff} 95%{text-shadow:-2px 0 #cc3333,2px 0 #4488ff} }
        @keyframes fu { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:translateY(0)} }
        .fu { animation:fu .2s ease both }
        button:hover { opacity:.8!important }
        a:hover { opacity:.7 }
        input:focus, select:focus { outline:none }
      `}</style>

      {/* ── HEADER ── */}
      <div style={{ background:`linear-gradient(180deg,${T.header} 0%,${T.bg} 100%)`, borderBottom:`1px solid ${T.border}`, padding:"16px 20px 0" }}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", flexWrap:"wrap", gap:10 }}>
          <div>
            <div style={{ fontFamily:"'Bebas Neue',sans-serif", fontSize:"clamp(11px,2vw,14px)", letterSpacing:"6px", color:T.text3, marginBottom:2 }}>
              LIVE LIQUID FUELS NEWS FEED
            </div>
            <div style={{ fontFamily:"'Bebas Neue',sans-serif", fontSize:"clamp(22px,4vw,36px)", letterSpacing:"3px", color:T.accent, lineHeight:1, animation:"glitch 12s infinite" }}>
              IRAN US CONFLICT
            </div>
            <div style={{ fontSize:"9px", letterSpacing:"3px", color:T.text3, marginTop:4 }}>
              LIVE NEWS FEED · UPDATED EVERY 3 MIN · ALL TIMES AEDT
            </div>
          </div>
          <div style={{ display:"flex", flexDirection:"column", alignItems:"flex-end", gap:5 }}>
            <div style={{ display:"flex", alignItems:"center", gap:7, flexWrap:"wrap", justifyContent:"flex-end" }}>
              <LiveDot color={T.accent} />
              <span style={{ fontSize:"10px", color:T.accent, letterSpacing:"2px" }}>LIVE · {countdown}s</span>
              <span style={{ fontSize:"10px", color:T.timeCol, letterSpacing:"1px" }}>{nowAEDT} AEDT</span>
              <button onClick={fetchAll} disabled={loading} style={{
                padding:"3px 10px", border:`1px solid ${T.border2}`, borderRadius:"2px",
                background:loading?`${T.accent}15`:T.card, color:loading?T.accent:T.text3,
                cursor:loading?"wait":"pointer", fontSize:"10px", fontFamily:"inherit", letterSpacing:"1px" }}>
                {loading ? "⟳ …" : "⟳ SYNC"}
              </button>
              <button onClick={() => setShowSettings(s => !s)} style={{
                padding:"3px 10px", border:`1px solid ${showSettings?T.accent:T.border2}`, borderRadius:"2px",
                background:showSettings?`${T.accent}15`:T.card, color:showSettings?T.accent:T.text3,
                cursor:"pointer", fontSize:"10px", fontFamily:"inherit", letterSpacing:"1px" }}>
                ⚙ SETTINGS
              </button>
            </div>
            <div style={{ fontSize:"9px", color:T.text3 }}>
              {okFeeds}/{totalFeeds} feeds · {liveEvents.length} live · {HISTORY.length} archived
            </div>
            {lastRefresh && (
              <div style={{ fontSize:"9px", color:T.timeCol }}>
                Last sync: {formatAEDT(lastRefresh)} AEDT
              </div>
            )}
          </div>
        </div>

        {/* SETTINGS PANEL */}
        {showSettings && (
          <div className="fu" style={{ margin:"12px 0 0", padding:"14px 16px", background:T.bg2, border:`1px solid ${T.border}`, borderRadius:"3px" }}>
            <div style={{ fontSize:"10px", color:T.text3, letterSpacing:"3px", marginBottom:10 }}>⚙ DISPLAY SETTINGS</div>
            <div style={{ display:"flex", gap:8, alignItems:"center", flexWrap:"wrap" }}>
              <span style={{ fontSize:"11px", color:T.text2 }}>Theme:</span>
              <button onClick={() => setDark(true)} style={{ padding:"5px 18px", border:`1px solid ${dark?T.accent:T.border2}`, borderRadius:"2px", background:dark?`${T.accent}18`:T.card, color:dark?T.accent:T.text2, cursor:"pointer", fontSize:"11px", fontFamily:"inherit" }}>🌑 Dark</button>
              <button onClick={() => setDark(false)} style={{ padding:"5px 18px", border:`1px solid ${!dark?T.accent:T.border2}`, borderRadius:"2px", background:!dark?`${T.accent}18`:T.card, color:!dark?T.accent:T.text2, cursor:"pointer", fontSize:"11px", fontFamily:"inherit" }}>☀️ Light</button>
            </div>
          </div>
        )}

        {/* TABS */}
        <div style={{ display:"flex", gap:5, marginTop:14, flexWrap:"wrap" }}>
          <TabBtn id="all"        label="📡 ALL" />
          <TabBtn id="global"     label="🌐 GLOBAL" />
          <TabBtn id="australia"  label="🇦🇺 AUSTRALIA" />
          <TabBtn id="nsw"        label="📍 NSW" />
          <TabBtn id="government" label="🏛️ GOVERNMENT" />
          <TabBtn id="timeline"   label="📋 TIMELINE" />
          <TabBtn id="tactical"   label="⚔️ TACTICAL" />
        </div>

        {/* SEARCH + TYPE FILTER — not on all/tactical */}
        {tab !== "all" && tab !== "tactical" && (
          <div style={{ display:"flex", gap:8, marginTop:10, paddingBottom:12, flexWrap:"wrap", alignItems:"center" }}>
            <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Search…"
              style={{ background:T.bg3, border:`1px solid ${T.border}`, borderRadius:"2px", color:T.text, padding:"5px 12px", fontSize:"11px", width:"180px", fontFamily:"inherit" }} />
            <select value={typeFilter} onChange={e => setTypeFilter(e.target.value)} style={{
              background:T.bg2, border:`1px solid ${T.border}`, borderRadius:"2px",
              color:T.text2, padding:"5px 10px", fontSize:"11px", fontFamily:"inherit", cursor:"pointer" }}>
              <option value="all">All Types</option>
              {allTypes.map(t => <option key={t} value={t}>{t}</option>)}
            </select>
            <span style={{ fontSize:"9px", color:T.text3 }}>
              {filtered(tab === "timeline" || tab === "government" ? tab === "government" ? "government" : null : tab).length} events
            </span>
          </div>
        )}
        <div style={{ height: (tab === "all" || tab === "tactical") ? 12 : 0 }} />
      </div>

      {/* ── FEED STATUS STRIP ── */}
      <div style={{ background:T.bg2, borderBottom:`1px solid ${T.border}`, padding:"5px 20px", display:"flex", gap:10, flexWrap:"wrap", overflowX:"auto" }}>
        {statusFeeds.map(f => {
          const s = feedStatus[f.id];
          return (
            <div key={f.id} style={{ display:"flex", alignItems:"center", gap:4 }}>
              <span style={{ width:6, height:6, borderRadius:"50%", display:"inline-block", flexShrink:0,
                background: !s ? "#333" : s.ok ? "#22cc66" : "#cc4444" }} />
              <span style={{ fontSize:"9px", color:T.text3, whiteSpace:"nowrap" }}>{f.label}</span>
            </div>
          );
        })}
      </div>

      {/* ── CONTENT ── */}
      <div style={{ maxWidth:"1400px", margin:"0 auto", padding:"16px 12px 48px" }}>

        {/* ALL — 4 streams */}
        {tab === "all" && (
          <div style={{ display:"flex", gap:8, flexWrap:"wrap", alignItems:"flex-start" }}>
            {[
              ["global",     "🌐 Global"],
              ["australia",  "🇦🇺 Australia"],
              ["nsw",        "📍 NSW"],
              ["government", "🏛️ Government"],
            ].map(([reg, label]) => {
              const items = filtered(reg).slice(0, 40);
              const isGovt = reg === "government";
              return (
                <div key={reg} style={{ flex:"1", minWidth:"220px", border:`1px solid ${isGovt ? T.govtCol+"44" : T.streamBorder}`, borderRadius:"3px", overflow:"hidden", background:T.streamBg }}>
                  <div style={{ padding:"9px 12px", borderBottom:`1px solid ${isGovt ? T.govtCol+"44" : T.streamBorder}`,
                    background: isGovt ? `${T.govtCol}12` : T.bg2,
                    display:"flex", justifyContent:"space-between", alignItems:"center" }}>
                    <span style={{ fontSize:"12px", fontWeight:700, color: isGovt ? T.govtCol : T.text, letterSpacing:"1px" }}>{label}</span>
                    <span style={{ fontSize:"9px", color:T.text3 }}>{items.length}</span>
                  </div>
                  {items.length === 0 && <div style={{ padding:"20px", textAlign:"center", fontSize:"10px", color:T.text3 }}>Fetching…</div>}
                  {items.map(e => <StreamItem key={e.id} event={e} T={T} />)}
                </div>
              );
            })}
          </div>
        )}

        {/* SINGLE REGION VIEWS */}
        {(tab === "global" || tab === "australia" || tab === "nsw") && (
          <div>
            {filtered(tab).map((e, i) => (
              <div key={e.id} className="fu" style={{ animationDelay:`${Math.min(i,20)*0.025}s` }}>
                <EventCard event={e} T={T} />
              </div>
            ))}
            {filtered(tab).length === 0 && (
              <div style={{ textAlign:"center", color:T.text3, padding:"60px 0", fontSize:"11px", letterSpacing:"2px" }}>NO EVENTS MATCH FILTERS</div>
            )}
          </div>
        )}

        {/* GOVERNMENT TAB */}
        {tab === "government" && (
          <div>
            <div style={{ display:"flex", gap:12, marginBottom:16, flexWrap:"wrap", alignItems:"center" }}>
              <div style={{ fontSize:"10px", color:T.govtCol, letterSpacing:"3px" }}>🏛️ AUSTRALIAN GOVERNMENT FEEDS</div>
              <div style={{ fontSize:"9px", color:T.text3 }}>
                Parliament · Ministerial · Departmental · Regulatory · Advisory
              </div>
            </div>
            {/* Source legend */}
            <div style={{ display:"flex", gap:6, flexWrap:"wrap", marginBottom:14 }}>
              {["Parliament","Ministerial","Department","Regulatory","Advisory","Research","Aggregated"].map(type => (
                <span key={type} style={{ fontSize:"9px", padding:"2px 8px", borderRadius:"2px",
                  background:`${T.govtCol}15`, border:`1px solid ${T.govtCol}33`, color:T.govtCol }}>
                  {type}
                </span>
              ))}
            </div>
            {filtered("government").map((e, i) => (
              <div key={e.id} className="fu" style={{ animationDelay:`${Math.min(i,20)*0.025}s` }}>
                <EventCard event={e} T={T} />
              </div>
            ))}
            {filtered("government").length === 0 && (
              <div style={{ padding:"40px", textAlign:"center", fontSize:"10px", color:T.text3,
                border:`1px solid ${T.border}`, borderRadius:"3px" }}>
                Fetching government feeds… {countdown}s until next sync
              </div>
            )}
          </div>
        )}

        {/* TIMELINE — all regions */}
        {tab === "timeline" && (
          <div>
            {allEvents.filter(e => e.region !== "tactical").map((e, i) => (
              <div key={e.id} className="fu" style={{ animationDelay:`${Math.min(i,20)*0.025}s` }}>
                <EventCard event={e} T={T} />
              </div>
            ))}
          </div>
        )}

        {/* TACTICAL */}
        {tab === "tactical" && (
          <div style={{ display:"flex", gap:12, flexWrap:"wrap", alignItems:"flex-start" }}>
            <div style={{ flex:"2", minWidth:"280px" }}>
              <div style={{ fontSize:"10px", color:T.text3, letterSpacing:"3px", marginBottom:10 }}>⚔️ LIVE TACTICAL FEED</div>
              {liveEvents.filter(e => e.region === "tactical").length === 0 && (
                <div style={{ padding:"24px", textAlign:"center", fontSize:"10px", color:T.text3, border:`1px solid ${T.border}`, borderRadius:"3px" }}>
                  Fetching tactical feeds… next sync in {countdown}s
                </div>
              )}
              {liveEvents.filter(e => e.region === "tactical").map((e, i) => (
                <div key={e.id} className="fu" style={{ animationDelay:`${i*0.02}s` }}>
                  <EventCard event={e} T={T} />
                </div>
              ))}
            </div>
            <div style={{ flex:"1", minWidth:"220px" }}>
              <div style={{ fontSize:"10px", color:T.text3, letterSpacing:"3px", marginBottom:10 }}>🐦 ACCOUNTS TO MONITOR</div>
              <div style={{ border:`1px solid ${T.border}`, borderRadius:"3px", overflow:"hidden" }}>
                <div style={{ padding:"8px 12px", background:T.bg2, borderBottom:`1px solid ${T.border}`, fontSize:"9px", color:T.text3, letterSpacing:"1px" }}>
                  X / TWITTER — MANUAL MONITORING
                </div>
                {TACTICAL_ACCOUNTS.map(acc => (
                  <div key={acc.handle} style={{ padding:"9px 12px", borderBottom:`1px solid ${T.border}` }}>
                    <a href={acc.url} target="_blank" rel="noopener noreferrer"
                      style={{ fontSize:"11px", fontWeight:600, color:T.accent, textDecoration:"none", display:"block", marginBottom:2 }}>
                      {acc.handle}
                    </a>
                    <div style={{ fontSize:"9px", color:T.text3 }}>{acc.desc}</div>
                  </div>
                ))}
                <div style={{ padding:"10px 12px", background:T.bg2, fontSize:"9px", color:T.text3, lineHeight:1.7 }}>
                  ⚠️ X/Twitter API requires a paid tier. Listed for manual monitoring. Future integration via Feedly Pro or a self-hosted Nitter proxy can automate this stream.
                </div>
              </div>
            </div>
          </div>
        )}
      </div>

      {/* ── FOOTER ── */}
      <div style={{ borderTop:`1px solid ${T.border}`, padding:"12px 20px", background:T.bg2, display:"flex", justifyContent:"space-between", flexWrap:"wrap", gap:8 }}>
        <div style={{ fontSize:"8px", color:T.text3, letterSpacing:"1px", lineHeight:1.8 }}>
          SOURCES: REUTERS · AP · BBC · AL JAZEERA · GUARDIAN · DW · FRANCE 24 · EURONEWS · FT · ABC · SMH · NEWS.COM.AU · 9NEWS · 7NEWS · PERTHNOW · THE WEST AUSTRALIAN<br/>
          GOVT: APH SENATE · HOUSE · PARLINFO · FOREIGN AFFAIRS MIN · DEFENCE MIN · DFAT · SMARTRAVELLER · ACCC · DCCEEW · GOOGLE NEWS<br/>
          TACTICAL: OILPRICE · IAEA · UN · CENTCOM · US DOD · AUTO-REFRESH 3MIN · ALL TIMES AEDT
        </div>
        <div style={{ fontSize:"8px", color:T.text3, textAlign:"right", lineHeight:1.8 }}>
          LIVE LIQUID FUELS NEWS FEED<br/>
          IRAN US CONFLICT MONITOR · {new Date().getFullYear()}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
</html>
