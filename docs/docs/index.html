function formatAEDT(d) {
  if (!d) return "—";
  try {
    return new Date(d).toLocaleString("en-AU", {
      timeZone:"Australia/Sydney", day:"2-digit", month:"2-digit",
      year:"2-digit", hour:"numeric", minute:"2-digit", hour12:true,
    }).replace(",","");
  } catch { return "—"; }
}
function formatTimeOnly(d) {
  if (!d) return "";
  try {
    return new Date(d).toLocaleString("en-AU", {
      timeZone:"Australia/Sydney", hour:"numeric", minute:"2-digit", hour12:true,
    });
  } catch { return ""; }
}
function formatDateShort(str) {
  if (!str) return "—";
  const p = str.split("-");
  return p.length===3 ? `${p[2]}/${p[1]}/${p[0].slice(2)}` : str;
}

const PRIMARY     = /\biran\b|hormuz|khamenei|irgc|jcpoa|\btehran\b|houthi|strait of hormuz|persian gulf|operation epic fury/i;
const COMMODITY   = /\bcrude\b|\bbrent\b|oil price|fuel security|liquid fuel|diesel supply|petrol price|fuel reserve|energy security|oil supply|fuel shortage/i;
const CONTEXT     = /iran|israel|middle east|hormuz|australia.*fuel|fuel.*australia|gulf|houthi|sanctions|persian/i;
const CONFLICT    = /\bceasefire\b|missile strike|air strike|ballistic missile|nuclear deal|nuclear weapon|enrichment|idf attack|us strike|israel.*attack|attack.*israel|naval blockade|warship.*gulf|gulf.*warship/i;
const GOVT_ANCHOR = /iran|hormuz|fuel security|liquid fuel|diesel|petrol.*price|fuel reserve|middle east|israel|ceasefire|strategic reserve|energy security/i;
const GOVT_ACTOR  = /australia|minister|dfat|albanese|penny wong|pat conroy|madeleine king|senate|aph|parliament.*fuel|fuel.*parliament|defence.*iran|iran.*defence/i;
const FUEL_CONFLICT = /fuel|diesel|petrol|liquid fuel|energy|oil|tanker|shipping|supply chain|reserves/i;

function isRelevant(title, desc, region, state) {
  const full = title + " " + desc;

  // State: must mention that state AND have a fuel/conflict anchor
  if (state) {
    const stateMatch = STATE_KEYWORDS[state]?.test(full) ?? false;
    const topicMatch = FUEL_CONFLICT.test(full) || PRIMARY.test(full) || CONFLICT.test(full);
    return stateMatch && topicMatch;
  }

  if (region === "australia") {
    // Govt feeds need actor + anchor; media feeds just need topic relevance
    return PRIMARY.test(full) || CONFLICT.test(full) ||
           (COMMODITY.test(full) && CONTEXT.test(full)) ||
           (GOVT_ANCHOR.test(full) && GOVT_ACTOR.test(full));
  }

  if (region === "tactical") {
    return PRIMARY.test(full) || CONFLICT.test(full) ||
           (COMMODITY.test(full) && CONTEXT.test(full));
  }

  // Global
  return PRIMARY.test(full) || CONFLICT.test(full) ||
         (COMMODITY.test(full) && CONTEXT.test(full));
}

// ── RSS PARSER ────────────────────────────────────────────────────────────
function parseRSS(xml, feed) {
  try {
    const doc = new DOMParser().parseFromString(xml, "text/xml");
    return Array.from(doc.querySelectorAll("item")).slice(0, 12).reduce((acc, item) => {
      const title  = item.querySelector("title")?.textContent?.trim() || "";
      const desc   = (item.querySelector("description")?.textContent || "")
        .replace(/<[^>]*>/g,"").replace(/\s+/g," ").trim().slice(0,320);
      const pubRaw = item.querySelector("pubDate")?.textContent || "";
      const link   = item.querySelector("link")?.textContent?.trim() || "#";
      let pubDate  = pubRaw ? new Date(pubRaw) : new Date();
      if (isNaN(pubDate)) pubDate = new Date();
      const dateStr = pubDate.toISOString().split("T")[0];
      if (!isRelevant(title, desc, feed.region, feed.state)) return acc;
      acc.push({
        id: `rss_${feed.id}_${Date.now()}_${acc.length}`,
        date: dateStr, pubDate,
        title: title.slice(0,130), summary: desc,
        region: feed.region || "global",
        state:  feed.state  || null,
        type:   feed.type,
        source: feed.label,
        isGovt: feed.isGovt || false,
        link, live: true,
      });
      return acc;
    }, []);
  } catch { return []; }
}

// ── COMPONENTS ────────────────────────────────────────────────────────────
function LiveDot({ color, size=7 }) {
  return <span style={{ display:"inline-block", width:size, height:size, borderRadius:"50%",
    background:color||"#ff6600", animation:"pls 1.3s infinite", flexShrink:0 }} />;
}

function SourceBadge({ type, isGovt, T }) {
  const col = SOURCE_COLORS[type] || "#888";
  return (
    <span style={{
      fontSize:"8px", padding:"1px 5px", borderRadius:"2px",
      background: `${col}22`, border:`1px solid ${col}55`,
      color: col, letterSpacing:"0.5px", fontWeight:600,
      whiteSpace:"nowrap", flexShrink:0,
    }}>
      {isGovt ? "🏛️ " : ""}{type?.toUpperCase()}
    </span>
  );
}

function TimeStamp({ event, T }) {
  // Always show date + time. Live items with pubDate get exact AEDT time.
  // Historical events get date only (no time known).
  const hasTime = !!event.pubDate;
  const dateStr = formatDateShort(event.date);
  const timeStr = hasTime ? formatTimeOnly(event.pubDate) : null;

  return (
    <div style={{ textAlign:"right", minWidth:94, flexShrink:0 }}>
      <div style={{ fontSize:"10px", color:T.text3, lineHeight:1.5, whiteSpace:"nowrap" }}>
        {dateStr}
      </div>
      {timeStr && (
        <div style={{ fontSize:"10px", color:T.timeCol, fontWeight:600, whiteSpace:"nowrap", lineHeight:1.4 }}>
          {timeStr} AEDT
        </div>
      )}
      {event.live && (
        <div style={{ display:"flex", alignItems:"center", justifyContent:"flex-end", gap:3, marginTop:2 }}>
          <LiveDot color={T.liveCol} size={5} />
          <span style={{ fontSize:"8px", color:T.liveCol, letterSpacing:"1px" }}>LIVE</span>
        </div>
      )}
    </div>
  );
}

function EventCard({ event, T }) {
  const [open, setOpen] = useState(false);
  const isCrit = event.critical;
  const isGovt = event.isGovt;
  const isState = !!event.state;
  const borderCol = isCrit ? T.accent : isGovt ? T.govtCol : event.live ? T.liveCol : "transparent";

  return (
    <div onClick={() => setOpen(o=>!o)} style={{
      display:"flex", gap:"12px", padding:"10px 14px 10px 10px", marginBottom:"1px",
      background: open ? T.cardHov : isCrit ? `${T.accent}11` : isGovt ? `${T.govtCol}08` : T.card,
      borderLeft:`3px solid ${borderCol}`,
      cursor:"pointer", transition:"background 0.15s",
    }}>
      <TimeStamp event={event} T={T} />
      {/* Node */}
      <div style={{ display:"flex", flexDirection:"column", alignItems:"center", flexShrink:0, width:14 }}>
        <div style={{ width:9, height:9, borderRadius:"50%", marginTop:3, flexShrink:0,
          background: isCrit?T.accent : isGovt?T.govtCol : event.live?T.liveCol : T.border2,
          border:`2px solid ${isCrit?T.accent:isGovt?T.govtCol:event.live?T.liveCol:T.border2}`,
          boxShadow: isCrit?`0 0 8px ${T.accent}66`:isGovt?`0 0 5px ${T.govtCol}44`:"none" }} />
        <div style={{ flex:1, width:1, background:T.border, marginTop:4, minHeight:14 }} />
      </div>
      {/* Content */}
      <div style={{ flex:1, minWidth:0 }}>
        {/* Title row */}
        <div style={{ display:"flex", gap:6, flexWrap:"wrap", alignItems:"flex-start", marginBottom:4 }}>
          <span style={{ fontSize:"12px", fontWeight:600, lineHeight:1.4, flex:1, minWidth:"140px",
            color: isCrit?T.accent : isGovt?T.govtCol : event.live?T.accent2 : T.text }}>
            {event.title}
          </span>
        </div>
        {/* Summary on expand */}
        {open && <div style={{ fontSize:"11px", color:T.text2, marginTop:4, lineHeight:1.6, marginBottom:6 }}>{event.summary}</div>}
        {/* Source row — visible, clean */}
        <div style={{ display:"flex", gap:8, alignItems:"center", flexWrap:"wrap", marginTop:4 }}>
          <SourceBadge type={event.type} isGovt={event.isGovt} T={T} />
          <span style={{ fontSize:"10px", color:T.text2, fontWeight:500 }}>{event.source}</span>
          {event.link && event.link !== "#" && (
            <a href={event.link} target="_blank" rel="noopener noreferrer"
              onClick={e=>e.stopPropagation()}
              style={{ fontSize:"9px", color:T.govtCol, textDecoration:"underline", marginLeft:"auto", letterSpacing:"0.5px" }}>
              source
            </a>
          )}
        </div>
      </div>
    </div>
  );
}

// Stream item for All view columns
function StreamItem({ event, T }) {
  const isGovt = event.isGovt;
  const isCrit = event.critical;
  const col = isCrit ? T.accent : isGovt ? T.govtCol : T.text;
  const srcCol = SOURCE_COLORS[event.type] || "#888";
  const dateStr = formatDateShort(event.date);
  const timeStr = event.pubDate ? formatTimeOnly(event.pubDate) : null;

  return (
    <div style={{ padding:"8px 10px", borderBottom:`1px solid ${T.streamBorder}`,
      background: isCrit?`${T.accent}0a` : isGovt?`${T.govtCol}07` : "transparent" }}>
      {/* Date + time line */}
      <div style={{ display:"flex", alignItems:"center", gap:6, marginBottom:4 }}>
        {event.live && <LiveDot color={isGovt?T.govtCol:T.liveCol} size={5} />}
        <span style={{ fontSize:"9px", color:T.text3, whiteSpace:"nowrap" }}>{dateStr}</span>
        {timeStr && (
          <span style={{ fontSize:"9px", color:T.timeCol, fontWeight:600, whiteSpace:"nowrap" }}>
            {timeStr} AEDT
          </span>
        )}
      </div>
      {/* Headline */}
      <div style={{ fontSize:"11px", fontWeight:600, color:col, lineHeight:1.4, marginBottom:5 }}>
        {event.title}
      </div>
      {/* Source row */}
      <div style={{ display:"flex", gap:6, alignItems:"center", flexWrap:"wrap" }}>
        <span style={{ fontSize:"8px", padding:"1px 4px", borderRadius:"2px",
          background:`${srcCol}22`, border:`1px solid ${srcCol}44`, color:srcCol,
          fontWeight:600, whiteSpace:"nowrap" }}>
          {isGovt?"🏛️ ":""}{event.type}
        </span>
        <span style={{ fontSize:"9px", color:T.text2, fontWeight:500 }}>{event.source}</span>
        {event.link && event.link !== "#" && (
          <a href={event.link} target="_blank" rel="noopener noreferrer"
            style={{ fontSize:"9px", color:T.govtCol, textDecoration:"underline", marginLeft:"auto", letterSpacing:"0.5px" }}>
            source
          </a>
        )}
      </div>
    </div>
  );
}

// ── MAIN APP ──────────────────────────────────────────────────────────────
function App() {
  const [dark, setDark]               = useState(true);
  const [tab, setTab]                 = useState("all");
  const [activeState, setActiveState] = useState("nsw");
  const [liveEvents, setLiveEvents]   = useState([]);
  const [feedStatus, setFeedStatus]   = useState({});
  const [loading, setLoading]         = useState(false);
  const [lastRefresh, setLastRefresh] = useState(null);
  const [countdown, setCountdown]     = useState(180);
  const [search, setSearch]           = useState("");
  const [showSettings, setShowSettings] = useState(false);
  const timerRef = useRef(null);
  const cdRef    = useRef(null);
  const T = dark ? DARK : LIGHT;

  const fetchAll = useCallback(async () => {
    setLoading(true);
    const statuses = {}, items = [];
    const feedsToFetch =
      tab === "tactical" ? TACTICAL_FEEDS :
      tab === "states"   ? STATE_FEEDS :
      ALL_FEEDS;

    await Promise.allSettled(feedsToFetch.map(async feed => {
      try {
        const r = await fetch(PROXY + encodeURIComponent(feed.url));
        if (!r.ok) throw new Error();
        const j = await r.json();
        const parsed = parseRSS(j.contents, feed);
        items.push(...parsed);
        statuses[feed.id] = { ok:true, count:parsed.length };
      } catch { statuses[feed.id] = { ok:false }; }
    }));

    setFeedStatus(p => ({ ...p, ...statuses }));
    if (items.length) {
      setLiveEvents(prev => {
        const seen = new Set(prev.map(e => e.title));
        return [...items.filter(e => !seen.has(e.title)), ...prev].slice(0, 500);
      });
    }
    setLastRefresh(new Date());
    setLoading(false);
    setCountdown(180);
  }, [tab]);

  useEffect(() => {
    fetchAll();
    timerRef.current = setInterval(fetchAll, REFRESH_MS);
    cdRef.current    = setInterval(() => setCountdown(c => Math.max(0,c-1)), 1000);
    return () => { clearInterval(timerRef.current); clearInterval(cdRef.current); };
  }, [fetchAll]);

  // Keep live items up to 7 days old; always keep all HISTORY entries
  const ONE_WEEK_MS = 7 * 24 * 60 * 60 * 1000;
  const nowMs = Date.now();
  const recentLive = liveEvents.filter(e => {
    const age = nowMs - (e.pubDate ? e.pubDate.getTime() : 0);
    return age < ONE_WEEK_MS;
  });

  const allEvents = [...recentLive, ...HISTORY].sort((a,b) => {
    const da = a.pubDate ? a.pubDate.getTime() : new Date(a.date).getTime();
    const db = b.pubDate ? b.pubDate.getTime() : new Date(b.date).getTime();
    return db - da; // newest first — strict chronological descending
  });

  function getEvents(region, state) {
    return allEvents.filter(e => {
      if (state)  return e.state === state;
      if (region) return e.region === region && !e.state;
      return true;
    }).filter(e => {
      if (!search) return true;
      return `${e.title} ${e.summary} ${e.source}`.toLowerCase().includes(search.toLowerCase());
    });
  }

  const okFeeds = Object.values(feedStatus).filter(s=>s.ok).length;
  const totalF  = ALL_FEEDS.length;
  const nowAEDT = new Date().toLocaleString("en-AU",{timeZone:"Australia/Sydney",hour:"numeric",minute:"2-digit",hour12:true,day:"2-digit",month:"2-digit"});

  function TabBtn({ id, label, accent }) {
    const active = tab === id;
    const ac = accent || T.accent;
    return (
      <button onClick={() => setTab(id)} style={{
        padding:"6px 14px", borderRadius:"2px", fontSize:"11px", letterSpacing:"1px",
        border: active ? `1px solid ${ac}` : `1px solid ${T.border2}`,
        background: active ? `${ac}18` : T.card,
        color: active ? ac : T.text3,
        cursor:"pointer", fontFamily:"inherit", transition:"all 0.12s",
      }}>{label}</button>
    );
  }

  // Which status feeds to show
  const statusFeedsToShow =
    tab === "tactical" ? TACTICAL_FEEDS :
    tab === "states"   ? STATE_FEEDS.filter(f => f.state === activeState) :
    tab === "australia"? AUSTRALIA_FEEDS :
    GLOBAL_FEEDS;

  return (
    <div style={{ background:T.bg, color:T.text, minHeight:"100vh", fontFamily:"'IBM Plex Mono','Courier New',monospace" }}>
      <style>{`
        @keyframes pls{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(1.5)}}
        @keyframes glitch{0%,92%,100%{text-shadow:none}93%{text-shadow:2px 0 #cc3333,-2px 0 #4488ff}95%{text-shadow:-2px 0 #cc3333,2px 0 #4488ff}}
        @keyframes fu{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
        .fu{animation:fu .2s ease both}
        button:hover{opacity:.8!important} a:hover{opacity:.7}
        input:focus,select:focus{outline:none}
      `}</style>

      {/* HEADER */}
      <div style={{ background:`linear-gradient(180deg,${T.header} 0%,${T.bg} 100%)`, borderBottom:`1px solid ${T.border}`, padding:"16px 20px 0" }}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", flexWrap:"wrap", gap:10 }}>
          <div>
            <div style={{ fontFamily:"'Bebas Neue',sans-serif", fontSize:"clamp(11px,2vw,14px)", letterSpacing:"6px", color:T.text3, marginBottom:2 }}>LIVE LIQUID FUELS NEWS FEED</div>
            <div style={{ fontFamily:"'Bebas Neue',sans-serif", fontSize:"clamp(22px,4vw,36px)", letterSpacing:"3px", color:T.accent, lineHeight:1, animation:"glitch 12s infinite" }}>IRAN US CONFLICT</div>
            <div style={{ fontSize:"9px", letterSpacing:"3px", color:T.text3, marginTop:4 }}>LIVE NEWS FEED · UPDATED EVERY 3 MIN · ALL TIMES AEDT</div>
          </div>
          <div style={{ display:"flex", flexDirection:"column", alignItems:"flex-end", gap:5 }}>
            <div style={{ display:"flex", alignItems:"center", gap:7, flexWrap:"wrap", justifyContent:"flex-end" }}>
              <LiveDot color={T.accent} />
              <span style={{ fontSize:"10px", color:T.accent, letterSpacing:"2px" }}>LIVE · {countdown}s</span>
              <span style={{ fontSize:"10px", color:T.timeCol }}>{nowAEDT} AEDT</span>
              <button onClick={fetchAll} disabled={loading} style={{ padding:"3px 10px", border:`1px solid ${T.border2}`, borderRadius:"2px", background:loading?`${T.accent}15`:T.card, color:loading?T.accent:T.text3, cursor:loading?"wait":"pointer", fontSize:"10px", fontFamily:"inherit" }}>
                {loading?"⟳ …":"⟳ SYNC"}
              </button>
              <button onClick={() => setShowSettings(s=>!s)} style={{ padding:"3px 10px", border:`1px solid ${showSettings?T.accent:T.border2}`, borderRadius:"2px", background:showSettings?`${T.accent}15`:T.card, color:showSettings?T.accent:T.text3, cursor:"pointer", fontSize:"10px", fontFamily:"inherit" }}>
                ⚙ SETTINGS
              </button>
            </div>
            <div style={{ fontSize:"9px", color:T.text3 }}>{okFeeds}/{totalF} feeds · {liveEvents.length} live · {HISTORY.length} archived</div>
            {lastRefresh && <div style={{ fontSize:"9px", color:T.timeCol }}>Last sync: {formatAEDT(lastRefresh)} AEDT</div>}
          </div>
        </div>

        {/* SETTINGS */}
        {showSettings && (
          <div className="fu" style={{ margin:"12px 0 0", padding:"14px 16px", background:T.bg2, border:`1px solid ${T.border}`, borderRadius:"3px" }}>
            <div style={{ fontSize:"10px", color:T.text3, letterSpacing:"3px", marginBottom:10 }}>⚙ DISPLAY SETTINGS</div>
            <div style={{ display:"flex", gap:8, alignItems:"center" }}>
              <span style={{ fontSize:"11px", color:T.text2 }}>Theme:</span>
              <button onClick={() => setDark(true)}  style={{ padding:"5px 18px", border:`1px solid ${dark?T.accent:T.border2}`,  background:dark?`${T.accent}18`:T.card,  color:dark?T.accent:T.text2,  cursor:"pointer", fontSize:"11px", fontFamily:"inherit", borderRadius:"2px" }}>🌑 Dark</button>
              <button onClick={() => setDark(false)} style={{ padding:"5px 18px", border:`1px solid ${!dark?T.accent:T.border2}`, background:!dark?`${T.accent}18`:T.card, color:!dark?T.accent:T.text2, cursor:"pointer", fontSize:"11px", fontFamily:"inherit", borderRadius:"2px" }}>☀️ Light</button>
            </div>
          </div>
        )}

        {/* MAIN TABS */}
        <div style={{ display:"flex", gap:5, marginTop:14, flexWrap:"wrap" }}>
          <TabBtn id="all"       label="📡 ALL" />
          <TabBtn id="global"    label="🌐 GLOBAL" />
          <TabBtn id="australia" label="🇦🇺 AUSTRALIA" accent={T.govtCol} />
          <TabBtn id="states"    label="📍 STATES" accent={T.stateCol} />
          <TabBtn id="timeline"  label="📋 TIMELINE" />
          <TabBtn id="tactical"  label="⚔️ TACTICAL" />
        </div>

        {/* STATE SUB-TABS */}
        {tab === "states" && (
          <div style={{ display:"flex", gap:4, marginTop:10, flexWrap:"wrap" }}>
            {Object.entries(STATE_META).map(([key, meta]) => (
              <button key={key} onClick={() => setActiveState(key)} style={{
                padding:"4px 12px", borderRadius:"2px", fontSize:"10px", letterSpacing:"1px",
                border: activeState===key ? `1px solid ${T.stateCol}` : `1px solid ${T.border2}`,
                background: activeState===key ? `${T.stateCol}18` : T.card,
                color: activeState===key ? T.stateCol : T.text3,
                cursor:"pointer", fontFamily:"inherit",
              }}>{meta.flag} {meta.label}</button>
            ))}
          </div>
        )}

        {/* SEARCH */}
        {(tab === "global" || tab === "australia" || tab === "timeline" || tab === "states") && (
          <div style={{ display:"flex", gap:8, marginTop:10, paddingBottom:12, flexWrap:"wrap", alignItems:"center" }}>
            <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search…"
              style={{ background:T.bg3, border:`1px solid ${T.border}`, borderRadius:"2px", color:T.text, padding:"5px 12px", fontSize:"11px", width:"200px", fontFamily:"inherit" }} />
            <span style={{ fontSize:"9px", color:T.text3 }}>
              {tab==="states" ? getEvents(null,activeState).length : getEvents(tab==="timeline"?null:tab,null).length} items
            </span>
          </div>
        )}
        <div style={{ height:(tab==="all"||tab==="tactical")?12:0 }} />
      </div>

      {/* FEED STATUS STRIP */}
      <div style={{ background:T.bg2, borderBottom:`1px solid ${T.border}`, padding:"5px 20px", display:"flex", gap:10, flexWrap:"wrap", overflowX:"auto" }}>
        {statusFeedsToShow.map(f => {
          const s = feedStatus[f.id];
          return (
            <div key={f.id} style={{ display:"flex", alignItems:"center", gap:4 }}>
              <span style={{ width:6, height:6, borderRadius:"50%", display:"inline-block", flexShrink:0,
                background:!s?"#333":s.ok?"#22cc66":"#cc4444" }} />
              <span style={{ fontSize:"9px", color:T.text3, whiteSpace:"nowrap" }}>{f.label}</span>
            </div>
          );
        })}
      </div>

      {/* CONTENT */}
      <div style={{ maxWidth:"1400px", margin:"0 auto", padding:"16px 12px 48px" }}>

        {/* ALL — 3 columns: Global, Australia (merged), Global */}
        {tab === "all" && (
          <div style={{ display:"flex", gap:8, flexWrap:"wrap", alignItems:"flex-start" }}>
            {[
              { reg:"global",    label:"🌐 Global",     accent:T.accent },
              { reg:"australia", label:"🇦🇺 Australia + Gov", accent:T.govtCol },
              { reg:"states",    label:"📍 States",     accent:T.stateCol, isState:true },
            ].map(col => {
              const items = col.isState
                ? allEvents.filter(e => !!e.state).slice(0,40)
                : getEvents(col.reg, null).slice(0,40);
              return (
                <div key={col.reg} style={{ flex:"1", minWidth:"240px", border:`1px solid ${col.accent}33`, borderRadius:"3px", overflow:"hidden", background:T.streamBg }}>
                  <div style={{ padding:"9px 12px", borderBottom:`1px solid ${col.accent}33`, background:`${col.accent}10`,
                    display:"flex", justifyContent:"space-between", alignItems:"center" }}>
                    <span style={{ fontSize:"12px", fontWeight:700, color:col.accent, letterSpacing:"1px" }}>{col.label}</span>
                    <span style={{ fontSize:"9px", color:T.text3 }}>{items.length}</span>
                  </div>
                  {items.length===0 && <div style={{ padding:"20px", textAlign:"center", fontSize:"10px", color:T.text3 }}>Fetching…</div>}
                  {items.map(e => <StreamItem key={e.id} event={e} T={T} />)}
                </div>
              );
            })}
          </div>
        )}

        {/* GLOBAL */}
        {tab === "global" && (
          <div>
            {getEvents("global", null).map((e,i) => (
              <div key={e.id} className="fu" style={{ animationDelay:`${Math.min(i,20)*0.025}s` }}>
                <EventCard event={e} T={T} />
              </div>
            ))}
          </div>
        )}

        {/* AUSTRALIA — media + govt merged, govt items highlighted */}
        {tab === "australia" && (
          <div>
            {/* Legend */}
            <div style={{ display:"flex", gap:8, marginBottom:14, flexWrap:"wrap", alignItems:"center" }}>
              <span style={{ fontSize:"9px", color:T.text3, letterSpacing:"1px" }}>SOURCE KEY:</span>
              {["Broadcast","Press","Wire","🏛️ Ministerial","🏛️ Parliament","🏛️ Department","🏛️ Advisory","🏛️ Regulatory"].map(t => {
                const raw = t.replace("🏛️ ","");
                const col = SOURCE_COLORS[raw] || "#888";
                return <span key={t} style={{ fontSize:"8px", padding:"2px 6px", borderRadius:"2px", background:`${col}22`, border:`1px solid ${col}44`, color:col }}>{t}</span>;
              })}
            </div>
            {getEvents("australia", null).map((e,i) => (
              <div key={e.id} className="fu" style={{ animationDelay:`${Math.min(i,20)*0.025}s` }}>
                <EventCard event={e} T={T} />
              </div>
            ))}
          </div>
        )}

        {/* STATES */}
        {tab === "states" && (
          <div>
            <div style={{ marginBottom:14 }}>
              <div style={{ fontSize:"11px", color:T.stateCol, letterSpacing:"2px", marginBottom:4 }}>
                {STATE_META[activeState]?.flag} {STATE_META[activeState]?.full} — fuel, energy & conflict-related updates
              </div>
              <div style={{ fontSize:"9px", color:T.text3 }}>
                Items must explicitly reference {STATE_META[activeState]?.full} or its major cities, and relate to fuel/energy/conflict.
              </div>
            </div>
            {getEvents(null, activeState).length === 0 && (
              <div style={{ padding:"40px", textAlign:"center", fontSize:"10px", color:T.text3, border:`1px solid ${T.border}`, borderRadius:"3px" }}>
                No state-specific items found yet for {STATE_META[activeState]?.full}. Fetching… ({countdown}s)
              </div>
            )}
            {getEvents(null, activeState).map((e,i) => (
              <div key={e.id} className="fu" style={{ animationDelay:`${Math.min(i,20)*0.025}s` }}>
                <EventCard event={e} T={T} />
              </div>
            ))}
          </div>
        )}

        {/* TIMELINE */}
        {tab === "timeline" && (
          <div>
            {allEvents.filter(e => !e.state && e.region !== "tactical").map((e,i) => (
              <div key={e.id} className="fu" style={{ animationDelay:`${Math.min(i,20)*0.025}s` }}>
                <EventCard event={e} T={T} />
              </div>
            ))}
          </div>
        )}

        {/* TACTICAL */}
        {tab === "tactical" && (
          <div style={{ display:"flex", gap:12, flexWrap:"wrap", alignItems:"flex-start" }}>
            <div style={{ flex:"2", minWidth:"280px" }}>
              <div style={{ fontSize:"10px", color:T.text3, letterSpacing:"3px", marginBottom:10 }}>⚔️ LIVE TACTICAL FEED</div>
              {liveEvents.filter(e=>e.region==="tactical").length===0 && (
                <div style={{ padding:"24px", textAlign:"center", fontSize:"10px", color:T.text3, border:`1px solid ${T.border}`, borderRadius:"3px" }}>
                  Fetching tactical feeds… {countdown}s
                </div>
              )}
              {liveEvents.filter(e=>e.region==="tactical").map((e,i) => (
                <div key={e.id} className="fu" style={{ animationDelay:`${i*0.02}s` }}>
                  <EventCard event={e} T={T} />
                </div>
              ))}
            </div>
            <div style={{ flex:"1", minWidth:"220px" }}>
              <div style={{ fontSize:"10px", color:T.text3, letterSpacing:"3px", marginBottom:10 }}>🐦 ACCOUNTS TO MONITOR</div>
              <div style={{ border:`1px solid ${T.border}`, borderRadius:"3px", overflow:"hidden" }}>
                <div style={{ padding:"8px 12px", background:T.bg2, borderBottom:`1px solid ${T.border}`, fontSize:"9px", color:T.text3, letterSpacing:"1px" }}>X / TWITTER — MANUAL MONITORING</div>
                {TACTICAL_ACCOUNTS.map(acc => (
                  <div key={acc.handle} style={{ padding:"9px 12px", borderBottom:`1px solid ${T.border}` }}>
                    <a href={acc.url} target="_blank" rel="noopener noreferrer"
                      style={{ fontSize:"11px", fontWeight:600, color:T.accent, textDecoration:"none", display:"block", marginBottom:2 }}>
                      {acc.handle}
                    </a>
                    <div style={{ fontSize:"9px", color:T.text3 }}>{acc.desc}</div>
                  </div>
                ))}
                <div style={{ padding:"10px 12px", background:T.bg2, fontSize:"9px", color:T.text3, lineHeight:1.7 }}>
                  ⚠️ X/Twitter API requires paid access. Listed for manual monitoring.
                </div>
              </div>
            </div>
          </div>
        )}
      </div>

      {/* FOOTER */}
      <div style={{ borderTop:`1px solid ${T.border}`, padding:"12px 20px", background:T.bg2, display:"flex", justifyContent:"space-between", flexWrap:"wrap", gap:8 }}>
        <div style={{ fontSize:"8px", color:T.text3, letterSpacing:"1px", lineHeight:1.8 }}>
          GLOBAL: REUTERS · AP · BBC · AL JAZEERA · GUARDIAN · DW · FRANCE 24 · EURONEWS · FT · CFR<br/>
          AUSTRALIA + GOV: ABC · SMH · NEWS.COM.AU · 9NEWS · 7NEWS · PERTHNOW · THE WEST AUSTRALIAN · DFAT · SMARTRAVELLER · DOD · ACCC · APH SENATE/HOUSE · FOREIGN AFFAIRS MIN · PM · ENERGY MIN<br/>
          STATES: ABC STATE FEEDS · LOCAL PRESS · STATE GOV GOOGLE NEWS · TACTICAL: OILPRICE · IAEA · UN · CENTCOM · US DOD<br/>
          AUTO-REFRESH 3MIN · ALL TIMES AEDT · MULTI-AGENCY USE
        </div>
        <div style={{ fontSize:"8px", color:T.text3, textAlign:"right", lineHeight:1.8 }}>
          LIVE LIQUID FUELS NEWS FEED<br/>IRAN US CONFLICT · {new Date().getFullYear()}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
